run:
  timeout: 5m
  go: "1.23"

linters-settings:
  goimports:
    local-prefixes: github.com/YASSERRMD/barq-slides
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        severity: warning
  cyclop:
    max-complexity: 15
  funlen:
    lines: 100
    statements: 60
  gocognit:
    min-complexity: 20
  godot:
    scope: declarations
    capital: true
  misspell:
    locale: US
  nolintlint:
    allow-leading-space: false
    require-explanation: true
    require-specific: true
  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(

linters:
  disable-all: true
  enable:
    - bodyclose
    - cyclop
    - dogsled
    - dupl
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exportloopref
    - funlen
    - gci
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - gomnd
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - stylecheck
    - thelper
    - tparallel
    - typecheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - funlen
        - goconst
        - gomnd
        - gosec
    - path: gen/
      linters:
        - all
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
