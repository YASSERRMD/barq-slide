services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      BARQ_SERVER__HOST: "0.0.0.0"
      BARQ_SERVER__PORT: "8090"
      BARQ_SERVER__CORS_ALLOW_ORIGIN: "*"
      BARQ_LLM__DEFAULT_PROVIDER: "anthropic"
      BARQ_LLM__ANTHROPIC__API_KEY: "${ANTHROPIC_API_KEY:-sk-ant-mock-key-for-local-demo}"
      BARQ_LLM__ANTHROPIC__MODEL: "claude-opus-4-6"
      BARQ_LLM__GEMINI__API_KEY: "${GEMINI_API_KEY:-mock-gemini-key}"
      BARQ_LLM__GEMINI__MODEL: "gemini-2.0-flash"
      BARQ_LLM__OPENAI__API_KEY: "${OPENAI_API_KEY:-sk-mock-openai-key}"
      BARQ_LLM__OPENAI__MODEL: "gpt-4o"
      BARQ_LLM__OPENAI__BASE_URL: "https://api.openai.com/v1"
      BARQ_LOG__LEVEL: "info"
      BARQ_LOG__FORMAT: "json"
    volumes:
      - barq_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  barq_data:

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8090"
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://backend:8090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
